<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="180 DAYS">
<title>180 DAYS · Rebuild Yourself</title>
<style>
  :root {
    --bg: #0b0e0c;
    --panel: #151b17;
    --panel2: #1d2720;
    --line: #29352d;
    --text: #f3f7f3;
    --muted: #9ba99e;
    --green: #65e59a;
    --gold: #f3cf72;
    --red: #ff7777;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #18241b 0%, #0b0e0c 55%);
    color: var(--text);
    font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 600px;
    margin-inline: auto;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 2px 14px;
  }
  .brand { font-weight: 900; letter-spacing: 2px; font-size: 13px; color: var(--green); }
  .sub { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-top: 4px; }
  button {
    border: 0;
    color: var(--text);
    background: var(--panel2);
    border-radius: 14px;
    padding: 12px 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--green); color: #07110a; }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button.danger { background: rgba(255, 119, 119, 0.15); color: var(--red); border: 1px solid rgba(255, 119, 119, 0.3); }
  .hero {
    background: linear-gradient(135deg, #1a2b20, #121a15);
    border: 1px solid #2b4432;
    border-radius: 24px;
    padding: 20px;
    margin: 8px 0 14px;
    box-shadow: 0 14px 40px #0005;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: var(--muted); }
  .day { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .big { font-size: 36px; font-weight: 850; margin: 5px 0; color: var(--green); }
  .progress { height: 9px; background: #29342c; border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
  .progress span { display: block; height: 100%; background: linear-gradient(90deg, #4fcf83, #a2f4bd); width: 0%; border-radius: 99px; transition: width 0.3s ease; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 18px; margin-bottom: 3px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .habit {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--panel2);
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .habit.done { border-color: rgba(101, 229, 154, 0.35); background: rgba(101, 229, 154, 0.08); }
  .habit-left { display: flex; align-items: center; gap: 12px; }
  .check {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #07110a;
  }
  .habit.done .check { background: var(--green); border-color: var(--green); }
  .habit-title { font-weight: 600; font-size: 15px; }
  .habit.done .habit-title { text-decoration: line-through; color: var(--muted); }
  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 10px; }
  .cell { aspect-ratio: 1; border-radius: 3px; background: var(--panel2); }
  .cell.full { background: var(--green); }
  .cell.part { background: rgba(101, 229, 154, 0.4); }
  .cell.today { outline: 1.5px solid var(--gold); }
</style>
</head>
<body>
  <header>
    <div>
      <div class="brand">180 DAYS</div>
      <div class="sub">REBUILD YOURSELF</div>
    </div>
    <button class="ghost" onclick="resetPrompt()">Сброс</button>
  </header>

  <div class="hero">
    <div class="row">
      <div>
        <div class="day" id="dayLabel">ДЕНЬ 1 ИЗ 180</div>
        <div class="big" id="pctLabel">0%</div>
      </div>
      <button class="primary" onclick="completeDay()">Закрыть день ✓</button>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div class="row" style="font-size: 12px; color: var(--muted);">
      <span id="todayStatus">Сегодня: 0 / 0 выполнено</span>
      <span id="streakLabel">Серия: 0 дн.</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="statDays">0</b><span>Дней пройдено</span></div>
    <div class="stat"><b id="statLeft">180</b><span>Осталось</span></div>
    <div class="stat"><b id="statRate">0%</b><span>Дисциплина</span></div>
  </div>

  <div class="card">
    <h3>Привычки на сегодня</h3>
    <div id="habitList"></div>
    <div class="add-row">
      <input type="text" id="newHabit" placeholder="Новая привычка..." onkeypress="if(event.key==='Enter') addHabit()">
      <button class="primary" onclick="addHabit()">+</button>
    </div>
  </div>

  <div class="card">
    <h3>Карта 180 дней</h3>
    <div class="grid" id="grid"></div>
  </div>

<script>
  const KEY = 'tracker_180_v1';
  const defaultHabits = [
    'Подъём без скроллинга телефона',
    'Тренировка / 10 000 шагов',
    'Чистое питание без сахара',
    'Чтение или обучение 30 мин',
    'Сон до 23:30'
  ];

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {
    startDate: todayStr(),
    habits: defaultHabits,
    history: {}
  };

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  }

  function getDayIndex() {
    const start = new Date(state.startDate + 'T00:00:00');
    const now = new Date(todayStr() + 'T00:00:00');
    const diff = Math.floor((now - start) / 86400000);
    return Math.max(0, Math.min(179, diff));
  }

  function toggleHabit(idx) {
    const t = todayStr();
    if (!state.history[t]) state.history[t] = [];
    const pos = state.history[t].indexOf(idx);
    if (pos >= 0) state.history[t].splice(pos, 1);
    else state.history[t].push(idx);
    save();
  }

  function addHabit() {
    const inp = document.getElementById('newHabit');
    const val = inp.value.trim();
    if (!val) return;
    state.habits.push(val);
    inp.value = '';
    save();
  }

  function removeHabit(e, idx) {
    e.stopPropagation();
    if (!confirm('Удалить привычку?')) return;
    state.habits.splice(idx, 1);
    Object.keys(state.history).forEach(d => {
      state.history[d] = state.history[d]
        .filter(i => i !== idx)
        .map(i => i > idx ? i - 1 : i);
    });
    save();
  }

  function completeDay() {
    const t = todayStr();
    state.history[t] = state.habits.map((_, i) => i);
    save();
  }

  function resetPrompt() {
    if (confirm('Начать 180 дней заново? Весь прогресс будет сброшен.')) {
      state = { startDate: todayStr(), habits: defaultHabits, history: {} };
      save();
    }
  }

  function render() {
    const t = todayStr();
    const dayIdx = getDayIndex();
    const doneToday = state.history[t] || [];
    const totalHabits = state.habits.length;

    document.getElementById('dayLabel').textContent = `ДЕНЬ ${dayIdx + 1} ИЗ 180`;
    const overallPct = Math.round(((dayIdx + (totalHabits ? doneToday.length / totalHabits : 0)) / 180) * 100);
    document.getElementById('pctLabel').textContent = `${overallPct}%`;
    document.getElementById('bar').style.width = `${overallPct}%`;
    document.getElementById('todayStatus').textContent = `Сегодня: ${doneToday.length} / ${totalHabits}`;

    // Habits list
    const list = document.getElementById('habitList');
    list.innerHTML = '';
    state.habits.forEach((h, i) => {
      const isDone = doneToday.includes(i);
      const div = document.createElement('div');
      div.className = 'habit' + (isDone ? ' done' : '');
      div.onclick = () => toggleHabit(i);
      div.innerHTML = `
        <div class="habit-left">
          <div class="check">${isDone ? '✓' : ''}</div>
          <div class="habit-title">${h}</div>
        </div>
        <button class="danger" style="padding: 4px 9px; font-size: 12px;" onclick="removeHabit(event, ${i})">✕</button>
      `;
      list.appendChild(div);
    });

    // Grid & Stats
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const start = new Date(state.startDate + 'T00:00:00');
    let completedDays = 0;
    let streak = 0;
    let tempStreak = 0;

    for (let i = 0; i < 180; i++) {
      const d = new Date(start.getTime() + i * 86400000);
      const dStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const count = (state.history[dStr] || []).length;
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (i === dayIdx) cell.classList.add('today');
      if (totalHabits > 0 && count >= totalHabits) {
        cell.classList.add('full');
        completedDays++;
        tempStreak++;
        if (i <= dayIdx) streak = tempStreak;
      } else if (count > 0) {
        cell.classList.add('part');
        if (i < dayIdx) tempStreak = 0;
      } else {
        if (i < dayIdx) tempStreak = 0;
      }
      grid.appendChild(cell);
    }

    document.getElementById('statDays').textContent = completedDays;
    document.getElementById('statLeft').textContent = 180 - (dayIdx + 1);
    const rate = Math.round((completedDays / (dayIdx + 1)) * 100);
    document.getElementById('statRate').textContent = `${rate}%`;
    document.getElementById('streakLabel').textContent = `Серия: ${streak} дн.`;
  }

  render();
</script>
</body>
</html>
